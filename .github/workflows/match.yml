name: match
on: [push, pull_request]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: original package (private mirror, by hash; the nightly URL is gone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download original-f3c1807 -R "$GITHUB_REPOSITORY" -p reef.deb -O /tmp/r.deb
          echo '17890f00b785a0a2c1566e80390915d75e1dce52b2f6f8f0db35ad936dcb7d8c  /tmp/r.deb' | sha256sum -c
          dpkg-deb -x /tmp/r.deb /tmp/orig
      - run: docker build -t reef-build docker
      - run: docker run --rm -v "$PWD:/w:ro" -v /tmp/orig/usr:/o:ro reef-build sh /w/tools/build-match.sh /o /w
