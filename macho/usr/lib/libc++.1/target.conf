install = usr/lib/libc++.1.dylib
version = 1700.0.0
compat = 1.0.0
sourcedir = upstream/llvm/libcxx/src
sources = algorithm.cpp any.cpp atomic.cpp barrier.cpp bind.cpp call_once.cpp charconv.cpp chrono.cpp condition_variable.cpp condition_variable_destructor.cpp error_category.cpp exception.cpp expected.cpp filesystem/directory_entry.cpp filesystem/directory_iterator.cpp filesystem/filesystem_clock.cpp filesystem/filesystem_error.cpp filesystem/int128_builtins.cpp filesystem/operations.cpp filesystem/path.cpp fstream.cpp functional.cpp future.cpp hash.cpp ios.cpp ios.instantiations.cpp iostream.cpp legacy_pointer_safety.cpp locale.cpp memory.cpp memory_resource.cpp mutex.cpp mutex_destructor.cpp new.cpp new_handler.cpp new_helpers.cpp optional.cpp ostream.cpp print.cpp pstl/libdispatch.cpp random.cpp random_shuffle.cpp regex.cpp ryu/d2fixed.cpp ryu/d2s.cpp ryu/f2s.cpp shared_mutex.cpp stdexcept.cpp string.cpp strstream.cpp system_error.cpp thread.cpp typeinfo.cpp valarray.cpp variant.cpp vector.cpp verbose_abort.cpp
libs = usr/lib/libSystem.B.dylib usr/lib/libc++abi.dylib reexport:usr/lib/libc++abi.dylib
cflags = -std=c++23 -nostdinc++ -I$REPO/macho/libcxx-config -isystem $REPO/upstream/llvm/libcxx/include -I$REPO/upstream/llvm/libcxxabi/include -I$REPO/upstream/llvm/libcxx/src -I$REPO/upstream/llvm/libcxx/src/include -I$REPO/upstream/llvm/libcxxabi/src -D_LIBCPP_BUILDING_LIBRARY -DLIBCXX_BUILDING_LIBCXXABI -DNDEBUG -ffile-prefix-map=$REPO/upstream/llvm/libcxx=/work/reef/third_party/libcxx
testlibs = usr/lib/libc++.1.dylib usr/lib/libc++abi.dylib usr/lib/libSystem.B.dylib
testflags = -D_LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS -std=c++20 -nostdinc++ -I$REPO/macho/libcxx-config -isystem $REPO/upstream/llvm/libcxx/include
minimum = 99
