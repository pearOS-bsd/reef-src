# libexslt 0.8.20 (the libexslt of upstream/libxslt 1.1.35, unchanged) as Apple's /usr/lib/libexslt.0.dylib (its exsltLibexsltVersion is 820), without gcrypt (no crypto functions).
install = usr/lib/libexslt.0.dylib
id = /usr/lib/libexslt.0.dylib
version = 9.15.0
compat = 9.0.0
sourcedir = upstream/libxslt
sources = libexslt/common.c libexslt/crypto.c libexslt/date.c libexslt/dynamic.c libexslt/exslt.c libexslt/functions.c libexslt/math.c libexslt/saxon.c libexslt/sets.c libexslt/strings.c
cflags = -DHAVE_CONFIG_H -I$REPO/macho/usr/lib/libxslt.1/include -I$REPO/upstream/libxslt -I$REPO/upstream/libxslt/libxslt -I$REPO/upstream/libxslt/libexslt -I$REPO/upstream/libxml2/include
libs = usr/lib/libSystem.B.dylib usr/lib/libxml2.2.dylib usr/lib/libxslt.1.dylib
