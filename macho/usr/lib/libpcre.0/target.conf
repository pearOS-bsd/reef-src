# PCRE 8.44 (upstream/pcre, unchanged), 8-bit library with UTF-8, Unicode properties and no JIT (the JIT functions are the stubs of a build without it): the build Apple ships as /usr/lib/libpcre.0.dylib
# (31 exports, `pcre_*` only; checked against the cache of macOS 26.7 with tools/check-exports.py).
install = usr/lib/libpcre.0.dylib
id = /usr/lib/libpcre.0.dylib
version = 1.1.0
compat = 1.0.0
sourcedir = upstream/pcre
sources = pcre_byte_order.c pcre_compile.c pcre_config.c pcre_dfa_exec.c pcre_exec.c pcre_fullinfo.c pcre_get.c pcre_globals.c pcre_jit_compile.c pcre_maketables.c pcre_newline.c pcre_ord2utf8.c pcre_refcount.c pcre_string_utils.c pcre_study.c pcre_tables.c pcre_ucd.c pcre_valid_utf8.c pcre_version.c pcre_xclass.c pcre_chartables.c.dist
cflags = -DHAVE_CONFIG_H -fvisibility=hidden -I$SRC -I$REPO/upstream/pcre
cflags.pcre_chartables.c.dist = -x c
libs = usr/lib/libSystem.B.dylib
