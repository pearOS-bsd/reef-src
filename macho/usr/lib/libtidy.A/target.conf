# HTML Tidy 5.8.0 (upstream/tidy-html5, unchanged) as /usr/lib/libtidy.A.dylib (Apple's is an older Tidy: the apps import 59 functions, all of them in 5.8.0).
install = usr/lib/libtidy.A.dylib
id = /usr/lib/libtidy.A.dylib
version = 1.0.0
compat = 1.0.0
sourcedir = upstream/tidy-html5
sources = src/access.c src/alloc.c src/attrdict.c src/attrs.c src/buffio.c src/charsets.c src/clean.c src/config.c src/entities.c src/fileio.c src/gdoc.c src/istack.c src/language.c src/lexer.c src/mappedio.c src/message.c src/messageobj.c src/parser.c src/pprint.c src/sprtf.c src/streamio.c src/tagask.c src/tags.c src/tidylib.c src/tmbstr.c src/utf8.c
cflags = -fvisibility=hidden '-DTIDY_EXPORT=__attribute__((visibility("default")))' -I$SRC/include -include $SRC/include/darwin-types.h -I$REPO/upstream/tidy-html5/include -I$REPO/upstream/tidy-html5/src
libs = usr/lib/libSystem.B.dylib
testlibs = usr/lib/libSystem.B.dylib usr/lib/libtidy.A.dylib
testflags = -I$SRC/include -include $SRC/include/darwin-types.h -I$REPO/upstream/tidy-html5/include
