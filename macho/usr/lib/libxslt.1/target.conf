# libxslt 1.1.35 (upstream/libxslt, unchanged) as Apple's /usr/lib/libxslt.1.dylib (its xsltLibxsltVersion is 10135), against the libxml2.2 of the root.
install = usr/lib/libxslt.1.dylib
id = /usr/lib/libxslt.1.dylib
version = 3.26.0
compat = 3.0.0
sourcedir = upstream/libxslt
sources = reef.c libxslt/attrvt.c libxslt/xslt.c libxslt/xsltlocale.c libxslt/xsltutils.c libxslt/pattern.c libxslt/templates.c libxslt/variables.c libxslt/keys.c libxslt/numbers.c libxslt/extensions.c libxslt/extra.c libxslt/functions.c libxslt/namespaces.c libxslt/imports.c libxslt/attributes.c libxslt/documents.c libxslt/preproc.c libxslt/transform.c libxslt/security.c
cflags = -DHAVE_CONFIG_H -include $SRC/reef-xml.h -I$SRC/include -I$REPO/upstream/libxslt -I$REPO/upstream/libxslt/libxslt -I$REPO/upstream/libxml2/include
libs = usr/lib/libSystem.B.dylib usr/lib/libxml2.2.dylib
testlibs = usr/lib/libSystem.B.dylib usr/lib/libxml2.2.dylib usr/lib/libxslt.1.dylib usr/lib/libexslt.0.dylib
testflags = -I$SRC/include -I$REPO/upstream/libxslt -I$REPO/upstream/libxml2/include
