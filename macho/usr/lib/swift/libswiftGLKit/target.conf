# libswiftGLKit: the Swift overlay of the framework with the same name (Apple's /usr/lib/swift/libswiftGLKit.dylib), with the symbols the apps import.
install = usr/lib/swift/libswiftGLKit.dylib
id = /usr/lib/swift/libswiftGLKit.dylib
version = 1.0.0
compat = 1.0.0
sources = overlay.S
libs = usr/lib/libSystem.B.dylib usr/lib/swift/libswiftCore.dylib
minos = 14.0
ldflags = -fixup_chains
