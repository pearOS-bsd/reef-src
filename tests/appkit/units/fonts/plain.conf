<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/tk/app/fonts/fontset</dir>
  <dir>/tk/app/fonts/nothing</dir>
  <cachedir>/tmp/fonts/fccache</cachedir>
  <match target="font"><test name="family"><string>Lato</string></test><edit name="weight" mode="assign"><const>bold</const></edit><edit name="hinting" mode="assign"><bool>false</bool></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test><edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <alias binding="same"><family>Times</family><prefer><family>P052</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Ubuntu Sans</family></prefer></alias>
</fontconfig>
