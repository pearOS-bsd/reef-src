<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/tk/app/fonts/fontset/var</dir>
  <dir>/tk/app/fonts/fontset/lato</dir>
  <dir>/tmp/fonts/gone2</dir>
  <cachedir>/tmp/fonts/fccache-scan</cachedir>
  <match target="scan"><test name="variable"><bool>true</bool></test><edit name="postscriptname" mode="assign"><string>VariableNamed</string></edit><edit name="fullname" mode="assign"><string>Variable Named</string></edit></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Black</string></test><edit name="postscriptname" mode="assign"><string>VariableNamed</string></edit><edit name="familylang" mode="assign"><string>ro</string></edit></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Thin</string></test><edit name="postscriptname" mode="delete"/><edit name="familylang" mode="delete"/><edit name="stylelang" mode="delete"/><edit name="fullname" mode="delete"/></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Light</string></test><edit name="family" mode="delete"/></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Heavy</string></test><edit name="style" mode="delete"/><edit name="weight" mode="delete"/><edit name="slant" mode="delete"/><edit name="width" mode="delete"/><edit name="spacing" mode="assign"><const>mono</const></edit></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Medium</string></test><edit name="weight" mode="assign"><double>87.5</double></edit><edit name="slant" mode="assign"><const>oblique</const></edit><edit name="width" mode="assign"><double>66.6</double></edit><edit name="spacing" mode="assign"><const>dual</const></edit></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Semibold</string></test><edit name="width" mode="assign"><double>500</double></edit><edit name="spacing" mode="assign"><const>charcell</const></edit><edit name="fontformat" mode="assign"><string>Odd</string></edit></match>
  <match target="scan"><test name="family"><string>Lato</string></test><test name="style"><string>Bold</string></test><edit name="weight" mode="assign"><range><double>50</double><double>200</double></range></edit><edit name="width" mode="assign"><range><double>60</double><double>110</double></range></edit></match>
</fontconfig>
